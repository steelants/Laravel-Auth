name: Tests

on:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        strategy:
            fail-fast: false
            matrix:
                # One job per supported Laravel version, on the highest PHP version it supports
                include:
                    -   laravel: '11.*'
                        testbench: '9.*'
                        php: '8.4'
                        # Laravel 11 is out of security support, every release has an open advisory
                        allow-insecure: true
                    -   laravel: '12.*'
                        testbench: '10.*'
                        php: '8.5'
                    -   laravel: '13.*'
                        testbench: '11.*'
                        php: '8.5'

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, gd
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache dependencies
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

            -   name: Allow packages with security advisories
                if: ${{ matrix.allow-insecure }}
                run: composer config --json policy.advisories.block false

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
                    composer update --prefer-stable --prefer-dist --no-interaction

            -   name: Execute tests
                run: vendor/bin/phpunit
