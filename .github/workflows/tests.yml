name: Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

        strategy:
            fail-fast: true
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
                laravel: ['11.*', '12.*', '13.*']
                dependency-version: [prefer-lowest, prefer-stable]
                include:
                    -   laravel: '11.*'
                        testbench: '9.*'
                    -   laravel: '12.*'
                        testbench: '10.*'
                    -   laravel: '13.*'
                        testbench: '11.*'
                exclude:
                    # Laravel 13 requires PHP 8.3+
                    -   laravel: '13.*'
                        php: '8.2'
                    # Laravel 11 is not supported on PHP 8.5
                    -   laravel: '11.*'
                        php: '8.5'

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, gd
                    coverage: none

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: dependencies-${{ matrix.dependency-version }}-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
                    composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

            -   name: Execute tests
                run: vendor/bin/phpunit
